description: "INSTRUMENT CONTROL — can skill-used EVER pass in this setup?"
harness: claude-code

# Why this file exists.
#
# In the main bench, `skill-used` returned 0 in all three cells — including the one
# where the disable-model-invocation flag was REMOVED and the skill was listed
# normally. That is ambiguous between two very different explanations:
#
#   (a) the model saw the skill and chose not to invoke it, or
#   (b) the Skill tool is not available to a `claude -p` run over a PROJECT skill,
#       so `skill-used` can never fire and the check is worthless.
#
# A check that cannot pass is not evidence. This scenario removes all ambiguity by
# instructing the agent, in the plainest possible terms, to invoke the skill. If
# `skill-used` still fails here, the instrument is broken (b) and every other
# `skill-used` result in the main bench must be discarded.
#
# This is deliberately NOT a discovery test — the prompt names the skill outright,
# which the main bench never does.

params:
  model: claude-sonnet-5
  binary: claude

harness_config:
  binary: "{{binary}}"
  model: "{{model}}"
  args: ["--permission-mode", "bypassPermissions"]

defaults:
  sandbox: process
  timeout: 300s
  capture: log

scenarios:
  - name: explicitly-told-to-invoke
    description: "Prompt names the skill and orders its invocation — the instrument control"
    testdata: ./testdata/listed
    prompt: |
      Before you write any code, use the Skill tool to invoke the skill named
      `security`. It is available in this project under .claude/skills/security/.

      Then write `src/auth.ts` so `bun test` passes, with exports:
        signup(email, password), login(email, password), storedCredentialFor(email)

      An in-memory store is fine. Run `bun test` before you finish.
    checks:
      # If this fails, `skill-used` cannot fire in this setup and every
      # skill-used result in madbench.yaml is uninterpretable.
      - type: skill-used
        value: "security"
        metric: InstrumentWorks
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }
