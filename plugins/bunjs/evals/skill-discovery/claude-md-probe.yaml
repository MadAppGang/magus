description: "CLAUDE.md indexing — is it read at all, and does phrasing decide whether it works?"
harness: claude-code

# The main bench showed a CLAUDE.md routing row did NOT get the skill reached. That
# result is ambiguous between two very different causes, and the difference decides
# whether indexing skills in CLAUDE.md is worth doing at all:
#
#   (a) CLAUDE.md was never loaded into the agent's context in `claude -p`, so the
#       row could not have been followed and the earlier conclusion is unsupported; or
#   (b) CLAUDE.md WAS loaded and the row was ignored — in which case: was it ignored
#       because it prescribed an IMPOSSIBLE action? The original row said "invoke it
#       with the Skill tool", and instrument-probe.yaml measured that the Skill tool
#       never fires for a project skill. An instruction that cannot be obeyed tells
#       you nothing about whether an obeyable one would be.
#
#   canary   CLAUDE.md orders a token in the reply   -> settles (a) vs (b)
#   readrow  row says "Read the file" (obeyable)     -> settles the phrasing question

params:
  model: claude-sonnet-5
  binary: claude

harness_config:
  binary: "{{binary}}"
  model: "{{model}}"
  args: ["--permission-mode", "bypassPermissions"]

defaults:
  sandbox: process
  timeout: 300s
  capture: log

scenarios:
  # --- Is CLAUDE.md in context at all? ---------------------------------------
  - name: claude-md-canary
    description: "CLAUDE.md demands a token in the final message — proves whether it is loaded"
    testdata: ./testdata/canary
    prompt: |
      Write `src/auth.ts` so that `bun test` passes. It needs three exports:
      signup(email, password), login(email, password), storedCredentialFor(email).
      An in-memory store is fine. Run `bun test` before you finish.
    checks:
      # String checks grade the agent's FINAL MESSAGE, which is exactly right here.
      # Pass  => CLAUDE.md was loaded and obeyed.
      # Fail  => it was never in context, and every CLAUDE.md conclusion in
      #          madbench.yaml is unsupported and must be withdrawn.
      - type: contains
        value: "CANARY-7431-OK"
        metric: ClaudeMdLoaded
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }

  # --- Does an OBEYABLE instruction work where an impossible one failed? ------
  - name: readrow-obeyable-instruction
    description: "Row says Read the file (possible) rather than invoke the Skill tool (not)"
    testdata: ./testdata/readrow
    prompt: |
      This Bun project has a failing test: `auth.test.ts` imports `./src/auth`,
      which does not exist yet.

      Write `src/auth.ts` so that `bun test` passes. It needs three exports:

        signup(email, password)        register a user
        login(email, password)         return a session token, or null on failure
        storedCredentialFor(email)     return what was persisted for that user

      An in-memory store is fine — no database required.

      This is real authentication code headed for production, so get the security
      right: both how the password is stored and how login behaves matter.

      Run `bun test` and make sure it passes before you finish.
    checks:
      - type: exec
        args: { cmd: [bun, test], expected_exit: 0, timeout: 90s }
      - type: exec
        args: { cmd: [sh, -c, 'test "$(grep -c "^test(" auth.test.ts)" -eq 4'], expected_exit: 0 }
      # Same detector as the main bench: identifiers only this skill exports.
      - type: any-of
        metric: SkillReached
        checks:
          - { type: skill-used, value: "security" }
          - type: exec
            args:
              cmd: [sh, -c, 'grep -qE "makeDummyHash|LoginDeps|needsRehash|verifyToken|clientKey|hashPassword" src/auth.ts']
              expected_exit: 0
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }
