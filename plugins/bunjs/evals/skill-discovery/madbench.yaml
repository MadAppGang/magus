description: "bunjs skill discovery — can a PLAIN prompt (no slash command) reach a disable-model-invocation skill?"
harness: claude-code

# WHAT THIS BENCH ANSWERS
#
# Every bunjs skill carries `disable-model-invocation: true`, which removes it from
# the skill listing Claude Code injects each turn. The model cannot see it, so it
# will never invoke it spontaneously. Discovery must come from somewhere else — the
# shipped claim is that a CLAUDE.md routing row carries it.
#
# Three cells, one variable changed at a time. The prompt is byte-identical in all
# three and names no skill and no slash command — that is the point.
#
#   cell     routing row   disable-model-invocation   isolates
#   ------   -----------   ------------------------   ----------------------------
#   bare     no            YES                        baseline: is it invisible?
#   routed   YES           YES                        does a routing row rescue it?
#   listed   no            no                         is the FLAG what blocks it?
#
# `listed` exists to kill a confound: if `routed` fails, that alone cannot
# distinguish "the flag blocks Skill invocation" from "project-level skills are not
# Skill-invocable in this sandbox at all". If `listed` invokes the skill and
# `routed` does not, the flag is the cause.
#
# sync-testdata.sh diffs the variants and refuses to build unless each differs from
# `bare` by exactly the one intended file.
#
# CAVEAT, stated because it bounds the conclusion: the skill is installed here as a
# PROJECT skill (.claude/skills/), not as the packaged bunjs plugin. That keeps the
# bench self-contained and independent of whatever version is installed globally,
# but it means this measures the skill + discovery mechanism, not plugin packaging.

params:
  model: claude-sonnet-5
  binary: claude

harness_config:
  binary: "{{binary}}"
  model: "{{model}}"
  # bypassPermissions, not acceptEdits: the agent must write files AND run `bun test`.
  # With acceptEdits the Bash call silently no-ops and the agent reports success
  # against a suite it never ran.
  args: ["--permission-mode", "bypassPermissions"]

defaults:
  sandbox: process
  timeout: 300s
  capture: log

# ---------------------------------------------------------------------------
# Shared blocks. The prompt and the fingerprint probes MUST be identical across
# cells or the comparison is meaningless.
# ---------------------------------------------------------------------------
x-shared:
  prompt: &build_auth |
    This Bun project has a failing test: `auth.test.ts` imports `./src/auth`,
    which does not exist yet.

    Write `src/auth.ts` so that `bun test` passes. It needs three exports:

      signup(email, password)        register a user
      login(email, password)         return a session token, or null on failure
      storedCredentialFor(email)     return what was persisted for that user

    An in-memory store is fine — no database required.

    This is real authentication code headed for production, so get the security
    right: both how the password is stored and how login behaves matter.

    Run `bun test` and make sure it passes before you finish.

  # Did reading the skill change the CODE? Reported in EVERY cell with threshold 0
  # so it never gates — it is a measurement, not an assertion. A signal that scores
  # the same with and without the skill is measuring the model's general knowledge
  # and proves nothing; comparing the SkillFingerprints score across cells is the
  # only way to know which it is.
  fingerprints: &fingerprints
    type: assert-set
    metric: SkillFingerprints
    threshold: 0.01   # NOT 0.0 — a zero threshold reads as unset and defaults to 1.0 (MEASURED)
    checks:
      - type: exec
        args: { cmd: [sh, -c, 'grep -q "Bun\.password" src/auth.ts'], expected_exit: 0 }
      - type: exec
        args: { cmd: [sh, -c, '! grep -qE "from \"(bcrypt|bcryptjs|argon2)\"" src/auth.ts'], expected_exit: 0 }
      - type: exec
        args: { cmd: [sh, -c, 'grep -qiE "dummy|timing|enumerat|constant.time" src/auth.ts'], expected_exit: 0 }
      - type: exec
        args: { cmd: [sh, -c, 'grep -qE "timingSafeEqual|safeEqual" src/auth.ts'], expected_exit: 0 }

  build_ok: &build_ok
    - type: exec
      args: { cmd: [bun, test], expected_exit: 0, timeout: 90s }
    # Anti-cheat: all four seeded cases survive. Deleting a test is the cheapest
    # way to make `bun test` pass.
    - type: exec
      args:
        cmd: [sh, -c, 'test "$(grep -c "^test(" auth.test.ts)" -eq 4']
        expected_exit: 0

scenarios:
  # --- CELL 1: baseline -------------------------------------------------------
  - name: bare-no-routing-row
    description: "Flag ON, no routing row — expect the skill to stay invisible"
    testdata: ./testdata/bare
    prompt: *build_auth
    checks:
      - type: exec
        args: { cmd: [bun, test], expected_exit: 0, timeout: 90s }
      - type: exec
        args: { cmd: [sh, -c, 'test "$(grep -c "^test(" auth.test.ts)" -eq 4'], expected_exit: 0 }
      # Passes when the skill was NOT invoked — the designed consequence of the flag.
      - type: not-any-of
        metric: SkillStaysHidden
        checks:
          - { type: skill-used, value: "security" }
      - *fingerprints
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }

  # --- CELL 2: does a routing row rescue discovery? ---------------------------
  - name: routed-via-claude-md
    description: "Flag ON plus a CLAUDE.md routing row — the shipped discovery claim"
    testdata: ./testdata/routed
    prompt: *build_auth
    checks:
      - type: exec
        args: { cmd: [bun, test], expected_exit: 0, timeout: 90s }
      - type: exec
        args: { cmd: [sh, -c, 'test "$(grep -c "^test(" auth.test.ts)" -eq 4'], expected_exit: 0 }
      # THE CLAIM UNDER TEST. A failure here means the routing row does not carry
      # discovery, and the plugin's documented mechanism needs rewriting.
      - type: any-of
        metric: SkillReached
        checks:
          # Path A: the Skill tool. MEASURED never to fire here, even when the
          # prompt explicitly ordered it — see instrument-probe.yaml.
          - { type: skill-used, value: "security" }
          # Path B: the agent read/copied the skill's assets. These identifiers are
          # exported ONLY by this skill, so a model cannot emit them from general
          # knowledge — which is exactly what makes this discriminating.
          - type: exec
            args:
              cmd: [sh, -c, 'grep -qE "makeDummyHash|LoginDeps|needsRehash|verifyToken|clientKey|hashPassword" src/auth.ts']
              expected_exit: 0
      - *fingerprints
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }

  # --- CELL 3: is the flag the blocker? --------------------------------------
  - name: listed-flag-removed
    description: "Flag REMOVED, no routing row — isolates the flag from the row"
    testdata: ./testdata/listed
    prompt: *build_auth
    checks:
      - type: exec
        args: { cmd: [bun, test], expected_exit: 0, timeout: 90s }
      - type: exec
        args: { cmd: [sh, -c, 'test "$(grep -c "^test(" auth.test.ts)" -eq 4'], expected_exit: 0 }
      # If this passes while cell 2 fails, the flag is what blocks Skill invocation
      # and no amount of CLAUDE.md prose will change that.
      - type: any-of
        metric: SkillReached
        checks:
          # Path A: the Skill tool. MEASURED never to fire here, even when the
          # prompt explicitly ordered it — see instrument-probe.yaml.
          - { type: skill-used, value: "security" }
          # Path B: the agent read/copied the skill's assets. These identifiers are
          # exported ONLY by this skill, so a model cannot emit them from general
          # knowledge — which is exactly what makes this discriminating.
          - type: exec
            args:
              cmd: [sh, -c, 'grep -qE "makeDummyHash|LoginDeps|needsRehash|verifyToken|clientKey|hashPassword" src/auth.ts']
              expected_exit: 0
      - *fingerprints
      - { type: latency, threshold: 300000 }
      - { type: cost, threshold: 0.60 }
