<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Monaco Repro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
  <h1 id="status">loading</h1>
  <div id="editor" style="width:800px;height:400px;border:1px solid #ccc;"></div>
  <input id="plain" type="text" placeholder="plain input" />
  <script>
    require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" } });
    require(["vs/editor/editor.main"], function () {
      window.__editor = monaco.editor.create(document.getElementById("editor"), {
        value: "ORIGINAL CONTENT",
        language: "plaintext",
      });
      document.getElementById("status").textContent = "ready";
    });
  </script>
</body>
</html>
