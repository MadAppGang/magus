# EX-ENVIRONMENT — the whole `environment:*` check family, one of each.
#
# A loadable probe for scripts/check-staleness.ts. `madbench list` proves only that the
# BenchSpec parses; it does NOT construct checks (measured on 0.33.0: an
# `environment:nonsense` type listed cleanly). `madbench preflight` constructs every check,
# so a renamed or removed type in this family fails preflight with madbench's own
# `unknown check type "…"` — which is the finding the probe exists to surface.
#
# Under `harness: mock` nothing is staged and nothing is captured, so at run time every
# check here would ERROR rather than fail. That is correct and irrelevant: this file is
# loaded and preflighted, never run. docs/checks.md — the environment family.
description: "EX-ENVIRONMENT every environment:* check type the skill teaches"
harness: mock
harness_config:
  environment:
    probe: true

scenarios:
  - name: names-every-type
    description: "One check per environment:* type, spelled as the catalogue spells it"
    prompt: "Say hello."
    checks:
      # The one-liner most benches want: every plugin the run staged is listed and loaded.
      - type: environment:matches-expected

      - type: environment:plugin-loaded
        value: madbench@magus

      - type: environment:skill-registered
        value: madbench:madbench-evals

      - type: environment:command-registered
        value: madbench:bench

      - type: environment:agent-registered
        value: madbench:operator

      # Two MCP questions, two checks. `mcp-connected` asks whether the TOOL registered
      # the server; `mcp-reachable` asks whether the SERVER answered madbench's own
      # initialize + tools/list before the agent launched. Neither implies the other.
      - type: environment:mcp-connected
        value: probe

      - type: environment:mcp-reachable
        value: probe
        args:
          tools: 1 # a floor: reported >= declared

      # Spelled exactly as the tool spells it. Errors when no system:init was captured.
      - type: environment:tool-available
        value: Skill

      - type: environment:plugin-inventory
        value: madbench@magus
        args:
          skills: 1 # each bound is a floor
