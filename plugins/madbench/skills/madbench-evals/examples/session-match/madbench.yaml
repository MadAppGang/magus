# EX-SESSION-MATCH — the Session checks that grade Events and the Driver.
#
# A loadable probe for scripts/check-staleness.ts. `madbench list` does NOT construct
# checks, so a retired or renamed check type lists cleanly; `madbench preflight` constructs
# every one and refuses an unknown type or a bad `session:match` argument by name. That is
# the surface this file guards: `session:match` (portable keys only — `raw_type`/`raw` need
# `harness:` and a bench that runs that harness), and the four Driver checks.
#
# Under `harness: mock` there is no Driver and no marker, so every check here fails under
# `madbench check`, which is the point: each one is a positive assertion.
# docs/checks.md — the Session family and "Finding a marker inside the Session".
description: "EX-SESSION-MATCH session:match and the Driver checks the skill teaches"
harness: mock

scenarios:
  - name: marker-and-driver
    description: "A marker reached the agent through a tool's output; a Driver answered"
    prompt: "Read notes.md and say what it contains."
    checks:
      # Graded on what was DELIVERED — the tool output the agent saw — not on whether the
      # agent chose to repeat it, which is all `contains` on the final answer can grade.
      - type: session:match
        value: BLUEHERON
        args: { type: tool_result }

      # What the agent asked, and with which options. `session:tool-args-match` cannot
      # reach AskUserQuestion's nested labels; this check reads them.
      - type: session:question-asked
        args:
          header: "Deploy target"
          options: [staging, production]

      # The keystroke selected what the Driver chose; an unreadable outcome fails too.
      - type: session:answer-verified
        args: { require_verified: true }

      # Why the conversation stopped — a truncated run fails this.
      - type: session:end-reason
        value: [script-complete, driver-done]

      # Who decided the Driver's answers: `scripted` proves no model was consulted.
      - type: session:driver-source
        value: scripted
