# EX-PLUGINS — `harness.config.plugins:`, staging a plugin registry into the run.
#
# The entry is a plugin FOLDER: the benchproof plugin of the one-plugin marketplace
# checked in beside madbench's own tests/plugin-staging bench, four directories up from
# this file in the madbench repository. docs/harness.md §3a.
#
# The identity the Checks name, benchproof@madbench-proof, is derived and never written:
# `benchproof` from the folder's plugin.json, `madbench-proof` from the enclosing
# .claude-plugin/marketplace.json that sources the folder.
#
# `harness: mock` accepts only `type` and `model`, so a plugin example declares the
# claude-code harness. Run `madbench preflight` on it when the question is whether the
# path resolves; a real run stages it and the `environment:*` Checks read what loaded.
description: "EX-PLUGINS harness.config.plugins: stages the in-repo benchproof plugin"
harness:
  type: claude-code
  config:
    plugins:
      - ../../../../tests/plugin-staging/marketplace/plugins/benchproof
  probe:
    require: true # refuse the run before any spend when a staged plugin did not load

scenarios:
  - name: sees-the-staged-plugin
    description: "The staged plugin is listed and loaded, and its skill is registered"
    prompt: "Say hello."
    checks:
      - type: environment:matches-expected
      - type: environment:plugin-loaded
        value: benchproof@madbench-proof
      - type: environment:skill-registered
        value: benchproof:staged-proof
