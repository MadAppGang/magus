# EX-METRICS — the `metrics:` expression form, bound to a `module/` export.
#
# It exists so the metrics form this skill teaches is checked against the binary. Every
# expression below is compiled when the bench loads, so an unknown key, an aggregate function
# madbench does not have or a binding the module does not export surfaces as `madbench list`
# exit 1 — at no cost.
#
# Shape: a Check writes a per-Scenario sample through a `module/` export, and the
# top-level `metrics:` folds those samples into the run's report. docs/metrics.md.
description: "EX-METRICS metrics: expression form with a module/ export in scope"
harness: mock

scenarios:
  - name: scores-a-reply
    description: "One Check writes a sample; the report folds it through a module export"
    prompt: "Reply with the single word: ready"
    checks:
      - type: contains
        value: ready
        metric: SaidReady
        metrics:
          # `percent` is exported by ./module/index.ts — every export binds by name.
          - metrics.readyPct = percent(score)
          - "metrics.wins += score > 0.5 ? 1 : 0"

# Aggregate stage: each name is the array of its per-Scenario samples.
metrics:
  - 'metrics.readyRate = { value: mean(readyPct), unit: "percent", better: "higher" }'
  - metrics.totalWins = sum(wins)
