    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a1b3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="670.2" height="607.8" rx="12" fill="#fbfbfd" stroke="#e8eaf0"/>
  <path d="M 160 78 L 160 130" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 160 182 L 160 234" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 160 286 L 160 338" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
