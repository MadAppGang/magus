<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 671.2 608.8" width="671.2" height="608.8" role="img" aria-label="How /multimodel:delegate runs a task in another model's session and brings its questions back to you">
  <title>How /multimodel:delegate runs a task in another model's session and brings its questions back to you</title>
