  <path d="M 160 374 L 160 514.8" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="160" y="448.4" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">completed</text>
  <path d="M 160 374 L 160 444.4 L 468.2 444.4 L 468.2 514.8" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="314.1" y="438.4" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">failed</text>
