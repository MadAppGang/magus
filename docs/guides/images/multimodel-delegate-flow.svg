  <text x="160" y="65" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">model · command · task</text>
  <rect x="52" y="130" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="160" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Parse and resolve</text>
  <text x="160" y="169" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">against the live catalog</text>
  <rect x="35" y="234" width="250" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="160" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">claudish create_session</text>
  <text x="160" y="273" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">a full session, your plugins loaded</text>
  <polygon points="64,338 256,338 268,356 256,374 64,374 52,356" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="160" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">Channel event</text>
  <rect x="351.2" y="338" width="234" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="468.2" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">It asks you a question</text>
  <text x="468.2" y="377" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">you answer · send_input · it resumes</text>
  <rect x="52" y="514.8" width="216" height="52" rx="9" fill="#ecf7f0" stroke="#82c39a" stroke-width="1.5"/>
  <text x="160" y="536.8" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#155232" text-anchor="middle">get_output</text>
  <text x="160" y="553.8" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">the result</text>
  <rect x="351.2" y="514.8" width="234" height="68" rx="9" fill="#fdeeee" stroke="#dd9494" stroke-width="1.5"/>
  <text x="468.2" y="536.8" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7a2626" text-anchor="middle">Reported verbatim,</text>
  <text x="468.2" y="552.8" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7a2626" text-anchor="middle">and it stops</text>
  <text x="468.2" y="569.8" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">no retry, no substitution</text>
