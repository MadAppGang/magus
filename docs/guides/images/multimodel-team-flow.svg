<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 832" width="830" height="832" role="img" aria-label="How /multimodel:team fans a question out to several models and turns their votes into one verdict">
  <title>How /multimodel:team fans a question out to several models and turns their votes into one verdict</title>
