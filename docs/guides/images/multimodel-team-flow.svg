  <path d="M 428 686 L 428 754" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 428 686 L 428 720 L 696 720 L 696 754" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="320" y="26" width="216" height="52" rx="9" fill="#eef2ff" stroke="#a5b1e8" stroke-width="1.5"/>
  <text x="428" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26307a" text-anchor="middle">/multimodel:team</text>
  <text x="428" y="65" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">the question</text>
  <rect x="320" y="130" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="428" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Build the alias table</text>
  <text x="428" y="169" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">live catalog + your aliases</text>
  <polygon points="332,234 524,234 536,252 524,270 332,270 320,252" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="428" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">Resolve the models</text>
  <rect x="52" y="338" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="160" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">External models</text>
  <text x="160" y="377" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">claudish team tool</text>
  <rect x="588" y="338" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="696" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">internal</text>
  <text x="696" y="377" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">a dev: subagent, via Task</text>
  <rect x="298" y="442" width="260" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="428" y="464" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Collect the vote blocks</text>
  <text x="428" y="481" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">each written without seeing the others</text>
  <rect x="298" y="546" width="260" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="428" y="568" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">APPROVE ÷ (APPROVE + REJECT)</text>
  <text x="428" y="585" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">ABSTAIN is excluded</text>
  <polygon points="332,650 524,650 536,668 524,686 332,686 320,668" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="428" y="672" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">Against the threshold</text>
  <rect x="52" y="754" width="216" height="36" rx="9" fill="#ecf7f0" stroke="#82c39a" stroke-width="1.5"/>
  <text x="160" y="776" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#155232" text-anchor="middle">APPROVED</text>
  <rect x="320" y="754" width="216" height="36" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="428" y="776" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">REJECTED · SPLIT</text>
  <rect x="588" y="754" width="216" height="52" rx="9" fill="#fdeeee" stroke="#dd9494" stroke-width="1.5"/>
  <text x="696" y="776" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7a2626" text-anchor="middle">INCONCLUSIVE</text>
  <text x="696" y="793" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">under 2 valid votes</text>
</svg>
