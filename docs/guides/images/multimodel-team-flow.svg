      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a1b3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="829" height="831" rx="12" fill="#fbfbfd" stroke="#e8eaf0"/>
