<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585.8 504" width="585.8" height="504" role="img" aria-label="What /dev:worktree cleanup checks before removing anything">
  <title>What /dev:worktree cleanup checks before removing anything</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a1b3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="584.8" height="503" rx="12" fill="#fbfbfd" stroke="#e8eaf0"/>
  <path d="M 160 78 L 160 130" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 268 148 L 308.9 148 L 308.9 156 L 349.8 156" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="308.9" y="146" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">yes — you choose</text>
  <path d="M 160 166 L 160 234" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="160" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">no</text>
  <path d="M 454.8 182 L 454.8 208 L 160 208 L 160 234" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 160 286 L 160 338" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 268 356 L 308.9 356 L 308.9 372 L 349.8 372" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="308.9" y="358" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">yes — you choose</text>
  <path d="M 160 374 L 160 442" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="160" y="412" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">no</text>
  <path d="M 454.8 406 L 454.8 424 L 160 424 L 160 442" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="52" y="26" width="216" height="52" rx="9" fill="#eef2ff" stroke="#a5b1e8" stroke-width="1.5"/>
  <text x="160" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26307a" text-anchor="middle">/dev:worktree cleanup</text>
  <text x="160" y="65" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">path</text>
  <polygon points="64,130 256,130 268,148 256,166 64,166 52,148" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="160" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">Uncommitted changes?</text>
  <rect x="349.8" y="130" width="210" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="454.8" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Commit · stash</text>
  <text x="454.8" y="168" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">discard · abort</text>
  <rect x="52" y="234" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="160" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">git worktree remove</text>
  <text x="160" y="273" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">never rm -rf</text>
  <polygon points="64,338 256,338 268,356 256,374 64,374 52,356" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="160" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">Has a database branch?</text>
  <rect x="349.8" y="338" width="210" height="68" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="454.8" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Apply to production,</text>
  <text x="454.8" y="376" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">discard, or keep</text>
  <text x="454.8" y="393" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">then delete the branch</text>
  <rect x="52" y="442" width="216" height="36" rx="9" fill="#ecf7f0" stroke="#82c39a" stroke-width="1.5"/>
  <text x="160" y="464" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#155232" text-anchor="middle">Done</text>
</svg>
