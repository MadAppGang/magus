<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 728" width="755" height="728" role="img" aria-label="How /bunjs:bun picks which of the eight skills to read">
  <title>How /bunjs:bun picks which of the eight skills to read</title>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a1b3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="754" height="727" rx="12" fill="#fbfbfd" stroke="#e8eaf0"/>
  <path d="M 294 78 L 294 130" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 414 148 L 471.5 148 L 471.5 156 L 529 156" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="471.5" y="146" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">no</text>
  <path d="M 294 166 L 294 234" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="294" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6779" text-anchor="middle" paint-order="stroke" stroke="#fbfbfd" stroke-width="3.5" stroke-linejoin="round">yes</text>
  <path d="M 294 286 L 294 338" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 294 374 L 294 442" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 294 526 L 294 546" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <path d="M 294 598 L 294 650" fill="none" stroke="#98a1b3" stroke-width="1.6" marker-end="url(#arw)"/>
  <rect x="186" y="26" width="216" height="52" rx="9" fill="#eef2ff" stroke="#a5b1e8" stroke-width="1.5"/>
  <text x="294" y="48" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26307a" text-anchor="middle">/bunjs:bun</text>
  <text x="294" y="65" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">the task</text>
  <polygon points="186,130 402,130 414,148 402,166 186,166 174,148" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="294" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">A Bun or TypeScript task?</text>
  <rect x="529" y="130" width="200" height="52" rx="9" fill="#fdeeee" stroke="#dd9494" stroke-width="1.5"/>
  <text x="629" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7a2626" text-anchor="middle">Says so, and stops</text>
  <text x="629" y="169" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">rather than guessing</text>
  <rect x="186" y="234" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="294" y="256" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Read the index</text>
  <text x="294" y="273" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">about 60 lines, not 4,000</text>
  <polygon points="171,338 417,338 429,356 417,374 171,374 159,356" fill="#fff8e8" stroke="#e2bd63" stroke-width="1.5"/>
  <text x="294" y="360" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5c4409" text-anchor="middle">What will this make you write?</text>
  <rect x="144" y="442" width="300" height="84" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="294" y="464" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">project-setup · http-service</text>
  <text x="294" y="480" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">errors · testing · security</text>
  <text x="294" y="496" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">production · performance · tui</text>
  <text x="294" y="513" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">read one or two; five means split the task</text>
  <rect x="186" y="546" width="216" height="52" rx="9" fill="#ffffff" stroke="#d3d8e2" stroke-width="1.5"/>
  <text x="294" y="568" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c2230" text-anchor="middle">Copy the shipped assets/</text>
  <text x="294" y="585" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">never retype them</text>
  <rect x="186" y="650" width="216" height="52" rx="9" fill="#ecf7f0" stroke="#82c39a" stroke-width="1.5"/>
  <text x="294" y="672" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#155232" text-anchor="middle">bun test + tsc --noEmit</text>
  <text x="294" y="689" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#77808f" text-anchor="middle">the Acceptance section</text>
</svg>
